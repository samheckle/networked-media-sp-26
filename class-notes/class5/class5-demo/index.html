<html>
<!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
<!-- A: metadata / hidden -->

<head>
    <title>class 5 demo 😌</title>

    <link href="style.css" rel="stylesheet">

    <!-- NEW: adding our script tag with our name of our file in the src -->
    <script src="main.js"></script>
</head>

<!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
<!-- A: front-end, visible, all, yes  -->

<body>

    <p>this is a paragraph</p>
    <!-- Q: What type of thing is a class? -->
    <!-- A: attribute -->
    <!-- Q: List 2 other types of _ _ _ _ _ _ _ _ _ (hint: they go in the opening tag) -->
    <!-- A: id, src, href, style, target-->
    <!-- Q: How many times can we use a class in a webpage? -->
    <!-- A: many! as much as you want! -->
    <p class="blue big show">this is a second paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <p class="blue">this is a second paragraph</p>
    <!-- Q: How many times can we use an id in a webpage? -->
    <!-- A: once -- name must be only used once, but id attribute can be used many times -->
    <p id="main">this is a third paragraph</p>

    <!-- now open up style.css -->
    <div>
        <div id="container">

        </div>
    </div>
</body>

</html>
