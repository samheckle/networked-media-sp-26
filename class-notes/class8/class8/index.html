<html>
  <head>
    <title>class 8 starter</title>
    <script src="main.js"></script>
    <link href="style.css" rel="stylesheet">
  </head>

  <body>
    <!-- Q: when do we use div elements vs. a p element? -->
     <!-- A: div: create a container / group for element , layer to be styled p: text content-->
    <!-- Q: how many classes does this first div have? -->
     <!-- A: 2: parent, container-->
    <!-- Q: how many children does the parent container have? -->
     <!-- A: 3 children that are all divs-->
    <div class="parent container">
      <div class="child container" id="button">click me!</div>
      <div class="child container"></div>
      <div class="child container"></div>
    </div>

    <!-- Q: how many times can we use a id name in an html file? -->
     <!-- A: ONCE -->
    <!-- Q: why do we use that amount? -->
     <!-- A: accessing a specific element with javascript-->
    <div id="rotate">

    </div>
  </body>
</html>
